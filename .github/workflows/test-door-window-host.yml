name: OpenTrace stage 02 — real 3D esquadrias

on:
  push:
    branches:
      - dev/parametric-door-window-2026-10-09
    paths:
      - 'OpenTrace_BIM/door_window*.py'
      - 'tests_host/**'
      - '.github/workflows/test-door-window-host.yml'
  workflow_dispatch:

jobs:
  host-mesh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: ingelibre/ingetrazo
          path: ingetrazo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0
          python -m pip install 'PySide6>=6.9,<7'
      - name: Real Group/Mesh topology tests for door and window
        working-directory: plugin
        env:
          PYTHONPATH: "${{ github.workspace }}/ingetrazo:${{ github.workspace }}/plugin"
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests_host -v
