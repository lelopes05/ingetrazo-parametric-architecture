<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111722"/><stop offset="1" stop-color="#1c2633"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#edf2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-opacity=".25"/>
    </filter>
    <style>
      .ui{font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#8aa0b7}.label{fill:#d9e3ef;font-size:15px}
      .small{font-size:13px}.tiny{font-size:11px}.dark{fill:#1b2530}.line{stroke:#d7dee7;stroke-width:1}
      .blue{fill:#2878d0}.accent{fill:#2f8be6}.card{fill:url(#panel);stroke:#cfd8e3;stroke-width:1}
    </style>
  </defs>
  <rect width="1200" height="750" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="54" rx="24" fill="#0d131c"/>
  <rect x="0" y="30" width="1200" height="24" fill="#0d131c"/>
  <g class="ui">
    <text x="28" y="34" fill="#eef5ff" font-size="20" font-weight="700">OpenTrace BIM</text>
    <text x="190" y="34" class="muted" font-size="14">for IngeTrazo</text>
    <text x="28" y="84" fill="#f1f5f9" font-size="28" font-weight="700">Layer combinations that drive model behavior</text>
    <text x="28" y="110" class="muted" font-size="14">Visibility, locking, folders, templates and intersection groups</text>
    
  <rect x="28" y="132" width="1144" height="548" rx="14" class="card" filter="url(#shadow)"/>
  <rect x="28" y="132" width="1144" height="48" rx="14" fill="#202d3a"/><rect x="28" y="160" width="1144" height="20" fill="#202d3a"/>
  <text x="52" y="162" fill="#fff" font-size="17" font-weight="700">Combinação de Camadas</text>
  <g transform="translate(52 204)">
    <rect x="0" y="0" width="260" height="420" rx="8" fill="#f7f9fb" stroke="#cbd5df"/>
    <text x="14" y="28" class="dark small" font-weight="700">Combinações</text>
    <text x="16" y="66" class="dark small">00 Modelo 3D</text>
    <rect x="10" y="82" width="240" height="36" rx="6" fill="#dbeafe"/>
    <text x="16" y="105" class="dark small" font-weight="700">03 Executivo - Planta</text>
    <text x="16" y="146" class="dark small">03 Executivo - Forro</text>
    <text x="16" y="182" class="dark small">05 Instalações - Elétrica</text>
    <text x="16" y="218" class="dark small">06 Compatibilização - Geral</text>
    <rect x="16" y="360" width="100" height="34" rx="6" class="blue"/><text x="38" y="382" fill="#fff" class="small">Aplicar</text>
    <rect x="128" y="360" width="106" height="34" rx="6" fill="#fff" stroke="#9fb0bf"/><text x="148" y="382" class="dark small">Templates...</text>

    <rect x="284" y="0" width="500" height="420" rx="8" fill="#fff" stroke="#cbd5df"/>
    <text x="302" y="30" class="dark small" font-weight="700">Camadas da combinação</text>
    <g class="dark tiny">
      <text x="304" y="66" font-weight="700">Nome</text><text x="560" y="66" font-weight="700">Visível</text><text x="628" y="66" font-weight="700">Bloqueada</text><text x="714" y="66" font-weight="700">Interseção</text>
      <line x1="300" y1="78" x2="770" y2="78" class="line"/>
      <text x="304" y="108">ARQ - Paredes Internas</text><text x="580" y="108">●</text><text x="660" y="108">○</text><text x="735" y="108">1</text>
      <text x="304" y="144">ARQ - Paredes Externas</text><text x="580" y="144">●</text><text x="660" y="144">○</text><text x="735" y="144">1</text>
      <text x="304" y="180">ARQ - Aberturas</text><text x="580" y="180">●</text><text x="660" y="180">○</text><text x="735" y="180">0</text>
      <text x="304" y="216">EST - Pilares</text><text x="580" y="216">○</text><text x="660" y="216">○</text><text x="735" y="216">2</text>
      <text x="304" y="252">EST - Vigas</text><text x="580" y="252">○</text><text x="660" y="252">○</text><text x="735" y="252">2</text>
      <text x="304" y="288">ELE - Eletrodutos</text><text x="580" y="288">○</text><text x="660" y="288">○</text><text x="735" y="288">3</text>
    </g>
    <rect x="808" y="10" width="270" height="258" rx="10" fill="#f7f9fb" stroke="#cbd5df"/>
    <text x="826" y="40" class="dark small" font-weight="700">Templates de projeto</text>
    <rect x="822" y="56" width="242" height="52" rx="7" fill="#dbeafe"/>
    <text x="836" y="78" class="dark small" font-weight="700">Arquitetura Completa</text>
    <text x="836" y="96" class="muted tiny">camadas + combinações prontas</text>
    <text x="836" y="136" class="dark small" font-weight="700">Arquitetura Essencial</text>
    <text x="836" y="154" class="muted tiny">estrutura mínima para começar</text>
    <text x="836" y="194" class="dark small" font-weight="700">Começar vazio</text>
    <text x="836" y="212" class="muted tiny">sem preset inicial</text>
    <text x="826" y="296" class="dark small" font-weight="700">Pastas virtuais</text>
    <text x="840" y="326" class="dark small">01 Arquitetura</text>
    <text x="840" y="354" class="dark small">02 Estrutura</text>
    <text x="840" y="382" class="dark small">04 Instalações</text>
    <text x="840" y="410" class="dark small">06 Documentação</text>
  </g>
  <rect x="350" y="642" width="500" height="28" rx="8" fill="#1f2b37"/>
  <text x="372" y="661" fill="#dbe8f3" class="small">Combinação de Camadas: Executivo - Planta   ⚙</text>

    <text x="28" y="724" class="muted tiny">UI concept mockup · OpenTrace BIM active development · not a runtime screenshot</text>
  </g>
</svg>