    <text x="200" y="292" class="dark tiny" font-weight="700">Esp.</text>
    <text x="248" y="292" class="dark tiny" font-weight="700">Núcleo</text>
    <text x="10" y="324" class="dark tiny">Reboco externo</text><text x="200" y="324" class="dark tiny">1,5 cm</text>
