    <circle cx="590" cy="165" r="5" fill="#2f8be6"/>
    <text x="80" y="370" fill="#557080" font-size="13">parede + laje + viga + pilar + abertura</text>
  </g>

  <rect x="830" y="132" width="342" height="548" rx="14" class="card" filter="url(#shadow)"/>
