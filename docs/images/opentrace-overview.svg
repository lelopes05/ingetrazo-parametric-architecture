    <text x="28" y="84" fill="#f1f5f9" font-size="28" font-weight="700">Parametric architecture, one workspace</text>
    <text x="28" y="110" class="muted" font-size="14">Unified wall/slab/column/beam/profile workflow</text>
    
  <rect x="28" y="132" width="778" height="548" rx="14" fill="#dfe6ec" filter="url(#shadow)"/>
