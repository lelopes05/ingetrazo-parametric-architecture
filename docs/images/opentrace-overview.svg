    <polygon points="360,315 360,165 590,165 590,315" fill="#e7edf1" stroke="#aeb9c4" stroke-width="2"/>
    <rect x="165" y="205" width="78" height="110" fill="#52697c"/>
    <rect x="405" y="215" width="105" height="68" fill="#7ca2bf"/>
    <rect x="285" y="105" width="34" height="210" fill="#b5bec6"/>
    <rect x="278" y="142" width="250" height="30" fill="#aeb7c0"/>
