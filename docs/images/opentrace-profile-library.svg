<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111722"/><stop offset="1" stop-color="#1c2633"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#edf2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-opacity=".25"/>
    </filter>
    <style>
      .ui{font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#8aa0b7}.label{fill:#d9e3ef;font-size:15px}
      .small{font-size:13px}.tiny{font-size:11px}.dark{fill:#1b2530}.line{stroke:#d7dee7;stroke-width:1}
      .blue{fill:#2878d0}.accent{fill:#2f8be6}.card{fill:url(#panel);stroke:#cfd8e3;stroke-width:1}
    </style>
  </defs>
  <rect width="1200" height="750" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="54" rx="24" fill="#0d131c"/>
