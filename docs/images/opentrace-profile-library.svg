    <text x="28" y="84" fill="#f1f5f9" font-size="28" font-weight="700">Reusable profiles and office libraries</text>
    <text x="28" y="110" class="muted" font-size="14">Structural catalogues + user-defined Complex Profiles</text>
    
  <rect x="28" y="132" width="500" height="548" rx="14" fill="#e6ebef" filter="url(#shadow)"/>
